name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Instalar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Instalar plataforma Android 37
        run: |
          android sdk install --beta platforms/android-37
          android sdk install build-tools/36.0.0

      - name: Preparar assinatura privada (opcional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
              echo "A assinatura privada requer os quatro GitHub Actions secrets."
              exit 1
            fi
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"
          else
            echo "Sem assinatura privada configurada: será usada a chave de teste."
          fi

      - name: Executar testes e compilar APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Guardar APK pessoal (versão otimizada)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pack-creator-private-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Guardar APK de depuração
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pack-creator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar release pessoal no GitHub
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Sample Pack Creator v1.3.1
          target_commitish: main
          files: app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          make_latest: true
          body: |
            Sample Pack Creator 1.3.1 — personal Android build.

            This APK is optimized and signed with the private keystore only when all four signing secrets are configured. Without them, GitHub Actions uses the Android debug key for personal testing only. A debug-signed APK is not a Play Store production release.

            The app creates sample-pack ZIP files locally on the device. It does not upload imported audio to a cloud service.
